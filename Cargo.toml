[package]
name = "ksec"
version = "0.1.0"
edition = "2024"
description = "Unified security scanner CLI — orchestrates gitleaks, trufflehog, trivy, osv-scanner, opengrep, socket"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "3"
indicatif = "0.17"
which = "7"
