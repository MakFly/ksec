name: Auto Release

# Publie automatiquement une release à chaque push sur master :
#   push → bump patch → commit + tag → build 4 plateformes → release GitHub.
#
# Tout se passe dans CE workflow (et non en laissant le tag déclencher
# release.yml) parce qu'un push fait avec le GITHUB_TOKEN ne déclenche pas
# d'autres workflows. C'est aussi ce qui empêche la boucle : le commit de
# bump poussé ici n'est jamais retraité par ce workflow.
#
# Pour une release manuelle avec un bump contrôlé (low/mid/high), le flux
# historique reste disponible : ./release.sh <low|mid|high>.
on:
  push:
    branches: [master]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Bump version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip on release commits
        id: gate
        run: |
          if git log -1 --pretty=%s | grep -qE '^release: v'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch, commit, tag, push
        id: bump
        if: steps.gate.outputs.skip == 'false'
        run: |
          set -eu
          V="$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')"
          MAJOR="$(echo "$V" | cut -d. -f1)"
          MINOR="$(echo "$V" | cut -d. -f2)"
          PATCH="$(echo "$V" | cut -d. -f3)"
          NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
          TAG="v${NEXT}"
          echo "→ ${V} → ${NEXT}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          sed -i "s/^version = \"${V}\"/version = \"${NEXT}\"/" Cargo.toml
          cargo build --release 2>/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "release: ${TAG}"
          git tag -a "$TAG" -m "Release ${TAG}"
          git push origin master
          git push origin "$TAG"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.skip == 'false'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: ksec-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: ksec-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: ksec-darwin-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: ksec-darwin-aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cp target/${{ matrix.target }}/release/ksec ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}
          sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  release:
    name: Create release
    needs: [version, build]
    if: needs.version.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" artifacts/ksec-* \
            --generate-notes \
            --title "${{ needs.version.outputs.tag }}"
